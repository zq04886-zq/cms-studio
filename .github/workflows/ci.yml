name: Verify CMS Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: cms_studio_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: cms_studio_test
      DB_USER: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            cms-node/package-lock.json
            cms-manage/package-lock.json
            crs/package-lock.json
      - run: npm run setup
      - run: npm run db:deploy --prefix cms-node
      - run: npm run check
      - run: npm test
      - run: npm run build
